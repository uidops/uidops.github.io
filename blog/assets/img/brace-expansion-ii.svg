<svg xmlns="http://www.w3.org/2000/svg" width="1056" height="320" viewBox="0 0 1056 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2F7"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect width="1056" height="320" fill="url(#bg)"/>

  <!-- editorial grid -->
  <path d="M0 268H1056" stroke="#CBD5E1" stroke-width="1"/>
  <path d="M0 24H1056" stroke="#E2E8F0" stroke-width="1"/>
  <path d="M610 0V320" stroke="#E2E8F0" stroke-width="1"/>

  <!-- left column -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="64" y="58" font-size="12" font-weight="700" letter-spacing="2.8" fill="#2563EB">
      FORMAL LANGUAGES / RUST / LEETCODE 1096
    </text>

    <text x="64" y="116" font-size="42" font-weight="750" letter-spacing="-1.2" fill="#0F172A">
      Brace Expansion II
    </text>

    <text x="64" y="151" font-size="18" fill="#475569">
      Denotational semantics and an LL(1) parser
    </text>

    <!-- restrained rule strip -->
    <g transform="translate(64 190)">
      <rect width="490" height="54" rx="10" fill="#FFFFFF" stroke="#D8E0EA"/>
      <text x="20" y="34" font-family="Georgia, serif" font-size="18" fill="#0F172A">⟦e⟧</text>
      <text x="66" y="34" font-size="16" fill="#64748B">=</text>
      <text x="89" y="34" font-size="16" font-weight="650" fill="#2563EB">union</text>
      <text x="153" y="34" font-size="16" fill="#64748B">·</text>
      <text x="174" y="34" font-size="16" font-weight="650" fill="#7C3AED">concatenation</text>
      <text x="307" y="34" font-size="16" fill="#64748B">·</text>
      <text x="329" y="34" font-size="16" font-weight="650" fill="#0F172A">finite language</text>
    </g>

    <text x="64" y="292" font-size="13" fill="#64748B">
      One pass · one-character lookahead · parse and evaluate together
    </text>
  </g>

  <!-- right technical composition -->
  <g transform="translate(650 48)" filter="url(#soft)">
    <rect x="0" y="0" width="342" height="204" rx="16" fill="#FFFFFF" stroke="#D7DEE8"/>

    <text x="24" y="30" font-family="Inter,Segoe UI,Arial,sans-serif"
          font-size="11" font-weight="700" letter-spacing="2" fill="#64748B">
      PARSER PIPELINE
    </text>

    <!-- expression -->
    <rect x="24" y="47" width="294" height="38" rx="8" fill="#F8FAFC"/>
    <text x="40" y="72" font-family="SFMono-Regular, Menlo, Consolas, monospace"
          font-size="16" fill="#0F172A">{a,b}{c,{d,e}}</text>

    <!-- pipeline -->
    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <rect x="24" y="105" width="72" height="38" rx="8" fill="#EFF6FF"/>
      <text x="60" y="129" text-anchor="middle" font-size="12" font-weight="700" fill="#2563EB">peek()</text>

      <path d="M96 124H120" stroke="#94A3B8" stroke-width="1.5"/>
      <path d="M116 120L121 124L116 128" fill="none" stroke="#94A3B8" stroke-width="1.5"/>

      <rect x="122" y="105" width="72" height="38" rx="8" fill="#F5F3FF"/>
      <text x="158" y="129" text-anchor="middle" font-size="12" font-weight="700" fill="#7C3AED">parse_a</text>

      <path d="M194 124H218" stroke="#94A3B8" stroke-width="1.5"/>
      <path d="M214 120L219 124L214 128" fill="none" stroke="#94A3B8" stroke-width="1.5"/>

      <rect x="220" y="105" width="98" height="38" rx="8" fill="#F8FAFC"/>
      <text x="269" y="129" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">cross / union</text>
    </g>

    <!-- output -->
    <path d="M171 143V160" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="24" y="163" width="294" height="22" rx="6" fill="#F8FAFC"/>
    <text x="36" y="178" font-family="SFMono-Regular, Menlo, Consolas, monospace"
          font-size="11.5" fill="#334155">ac · ad · ae · bc · bd · be</text>
  </g>

  <!-- accent rail -->
  <rect x="0" y="0" width="6" height="320" fill="url(#line)"/>
  <rect x="64" y="305" width="928" height="2" fill="url(#line)" opacity=".75"/>
</svg>