name: Update contribution calendar

on:
  schedule:
    # Mondays 04:17 UTC — keeps data/contributions.js (the faint calendar
    # behind the hero's 3D model) rolling with the real GitHub graph.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate snapshot
        run: python3 scripts/update-contributions.py
      - name: Commit when changed
        run: |
          if git diff --quiet -- data/contributions.js; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.js
          git commit -m "chore: refresh GitHub contribution calendar"
          git push
